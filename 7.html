<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه هوشمند محاسبه نفس روزانه و هفتگی</title>
<style>
:root {
--bg-color: #f1f5f9;
--card-bg: #ffffff;
--primary: #1e293b;
--accent: #2563eb;
--success: #16a34a;
--danger: #dc2626;
--border: #cbd5e1;
}

body {
font-family: Tahoma, 'Vazirmatn', sans-serif;
background-color: var(--bg-color);
color: #334155;
margin: 0;
padding: 15px;
direction: rtl;
}

.container {
max-width: 900px;
margin: 0 auto;
background: var(--card-bg);
padding: 20px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

header {
text-align: center;
border-bottom: 2px solid #e2e8f0;
padding-bottom: 12px;
margin-bottom: 15px;
}

h1 { margin: 0 0 5px 0; color: var(--primary); font-size: 20px; }
p.subtitle { margin: 0; color: #64748b; font-size: 13px; }

/* Day Tabs */
.tabs {
display: flex;
gap: 5px;
overflow-x: auto;
padding-bottom: 10px;
margin-bottom: 15px;
border-bottom: 1px solid var(--border);
}

.tab-btn {
background: #e2e8f0;
border: none;
padding: 8px 14px;
border-radius: 6px;
cursor: pointer;
font-family: inherit;
font-weight: bold;
font-size: 12.5px;
white-space: nowrap;
transition: all 0.2s;
}

.tab-btn.active {
background: var(--accent);
color: white;
}

/* Score Dashboard */
.score-board {
display: flex;
justify-content: space-between;
align-items: center;
background: #f8fafc;
padding: 12px 18px;
border-radius: 8px;
border-right: 5px solid var(--accent);
margin-bottom: 15px;
}

.score-box { font-size: 14px; font-weight: bold; }
.score-num { font-size: 18px; color: var(--accent); }

/* Form Sections */
.section-title {
background: #f1f5f9;
padding: 8px 12px;
font-weight: bold;
color: var(--primary);
border-radius: 6px;
margin: 15px 0 10px 0;
font-size: 14px;
border-right: 4px solid var(--accent);
}

.grid-form {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 10px;
}

.form-group {
display: flex;
justify-content: space-between;
align-items: center;
background: #fafafa;
padding: 8px 12px;
border: 1px solid #e2e8f0;
border-radius: 6px;
}

.form-group label {
font-size: 12.5px;
font-weight: 500;
}

select {
padding: 5px 8px;
border-radius: 5px;
border: 1px solid var(--border);
font-family: inherit;
font-size: 12px;
background: white;
cursor: pointer;
}

/* Actions Bar */
.actions {
display: flex;
justify-content: space-between;
margin-top: 20px;
gap: 10px;
}

.btn {
padding: 8px 16px;
border: none;
border-radius: 6px;
cursor: pointer;
font-family: inherit;
font-weight: bold;
font-size: 12px;
}

.btn-reset { background: var(--danger); color: white; }
.btn-print { background: var(--success); color: white; }

/* Table View for Weekly Summary */
.summary-table {
width: 100%;
border-collapse: collapse;
font-size: 11.5px;
margin-top: 10px;
display: none;
}

.summary-table th, .summary-table td {
border: 1px solid var(--border);
padding: 6px;
text-align: center;
}

.summary-table th { background: var(--primary); color: white; }

@media print {
.tabs, .actions, .score-board { display: none; }
.container { box-shadow: none; padding: 0; }
.summary-table { display: table !important; }
.grid-form { display: none; }
}
</style>
</head>
<body>

<div class="container">
<header>
<h1>سامانه هوشمند و تعاملی محاسبه نفس</h1>
<p class="subtitle">«حاسِبُوا اَنْفُسَکُمْ قَبْلَ اَنْ تُحاسَبُوا»</p>
</header>

<!-- Day Navigation -->
<div class="tabs">
<button class="tab-btn active" onclick="switchDay('شنبه')">شنبه</button>
<button class="tab-btn" onclick="switchDay('یکشنبه')">یکشنبه</button>
<button class="tab-btn" onclick="switchDay('دوشنبه')">دوشنبه</button>
<button class="tab-btn" onclick="switchDay('سه‌شنبه')">سه‌شنبه</button>
<button class="tab-btn" onclick="switchDay('چهارشنبه')">چهارشنبه</button>
<button class="tab-btn" onclick="switchDay('پنج‌شنبه')">پنج‌شنبه</button>
<button class="tab-btn" onclick="switchDay('جمعه')">جمعه</button>
<button class="tab-btn" style="background:#0f172a; color:white;" onclick="switchDay('خلاصه')">📊 کارنامه کل هفته</button>
</div>

<!-- Live Score Header -->
<div class="score-board" id="scoreBoard">
<div class="score-box">امتیاز امروز (<span id="currentDayTitle">شنبه</span>): <span class="score-num" id="dayScore">0</span></div>
<div class="score-box">مجموع کل هفته: <span class="score-num" id="weekScore" style="color:var(--success)">0</span></div>
</div>

<!-- Form for Active Day -->
<div id="formContainer">

<!-- ۱. عبادی -->
<div class="section-title">۱. محور عبادی</div>
<div class="grid-form">
<div class="form-group">
<label>نماز اول وقت</label>
<select class="calc-input" data-key="namaz_avval">
<option value="0">بدون اول وقت (0)</option>
<option value="20">1 نماز (+20)</option>
<option value="40">2 نماز (+40)</option>
<option value="60">3 نماز (+60)</option>
</select>
</div>

<div class="form-group">
<label>حضور قلب نماز</label>
<select class="calc-input" data-key="hozor_ghalb">
<option value="0">0 (0)</option>
<option value="10">1 (+10)</option>
<option value="20">2 (+20)</option>
<option value="30">3 (+30)</option>
</select>
</div>

<div class="form-group">
<label>نماز جماعت</label>
<select class="calc-input" data-key="namaz_jamaat">
<option value="0">غیر جماعت (0)</option>
<option value="20">1 نماز (+20)</option>
<option value="40">2 نماز (+40)</option>
<option value="60">3 نماز (+60)</option>
</select>
</div>

<div class="form-group">
<label>انس با قرآن</label>
<select class="calc-input" data-key="quran">
<option value="0">امروز قرآن نخواندم (0)</option>
<option value="10">یک صفحه (+10)</option>
<option value="20">دو صفحه (+20)</option>
</select>
</div>

<div class="form-group">
<label>دعا و زیارت</label>
<select class="calc-input" data-key="doa">
<option value="0">امروز دعا و زیارت نخواندم (0)</option>
<option value="10">امروز دعا و زیارت خواندم (+10)</option>
</select>
</div>

<div class="form-group">
<label>نماز شب</label>
<select class="calc-input" data-key="namaz_shab">
<option value="0">نخواندم (0)</option>
<option value="50">خواندم (+50)</option>
</select>
</div>

<div class="form-group">
<label>قضای نماز</label>
<select class="calc-input" data-key="ghaza_namaz">
<option value="0">0 (0)</option>
<option value="-35">1 (-35)</option>
<option value="-70">2 (-70)</option>
<option value="-105">3 (-105)</option>
</select>
</div>

<div class="form-group">
<label>خودنمایی</label>
<select class="calc-input" data-key="khodnamayi">
<option value="0">نکردم (0)</option>
<option value="-15">کردم (-15)</option>
</select>
</div>
</div>

<!-- ۲. نظم و مسئولیت -->
<div class="section-title">۲. محور نظم و سلامت</div>
<div class="grid-form">
<div class="form-group">
<label>با برنامه بودن</label>
<select class="calc-input" data-key="barnameh">
<option value="0">نبودم (0)</option>
<option value="20">بودم (+20)</option>
</select>
</div>

<div class="form-group">
<label>خواب به موقع</label>
<select class="calc-input" data-key="khwab">
<option value="0">نداشتم (0)</option>
<option value="10">داشتم (+10)</option>
</select>
</div>

<div class="form-group">
<label>ورزش و سلامت جسم</label>
<select class="calc-input" data-key="varzesh">
<option value="0">ورزش نکردم (0)</option>
<option value="10">شنا انجام دادم (+10)</option>
<option value="10">باشگاه رفتم (+10)</option>
</select>
</div>

<div class="form-group">
<label>اتلاف وقت تو گوشی</label>
<select class="calc-input" data-key="gushi">
<option value="0">کمتر از ۲ ساعت (0)</option>
<option value="-15">۲ ساعت (-15)</option>
<option value="-30">۳ ساعت (-30)</option>
<option value="-45">۴ ساعت (-45)</option>
<option value="-60">۵ ساعت (-60)</option>
</select>
</div>
</div>

<!-- ۳. طهارت درون -->
<div class="section-title">۳. محور طهارت درون</div>
<div class="grid-form">
<div class="form-group">
<label>کنترل شهوت</label>
<select class="calc-input" data-key="shahwat">
<option value="0">شهوتی نبود (0)</option>
<option value="30">کنترل کردم (+30)</option>
<option value="-30">کنترلی نداشتم (-30)</option>
</select>
</div>

<div class="form-group">
<label>حرام خواری</label>
<select class="calc-input" data-key="haram_khwari">
<option value="0">نکردم (0)</option>
<option value="-50">کردم (-50)</option>
</select>
</div>

<div class="form-group">
<label>تماشای پورن</label>
<select class="calc-input" data-key="porn">
<option value="0">ندیدم (0)</option>
<option value="-100">دیدم (-100)</option>
</select>
</div>

<div class="form-group">
<label>خودارضایی</label>
<select class="calc-input" data-key="masturbation">
<option value="0">نکردم (0)</option>
<option value="-40">کردم (-40)</option>
</select>
</div>
</div>

<!-- ۴. اخلاق -->
<div class="section-title">۴. محور اخلاق و ارتباطات</div>
<div class="grid-form">
<div class="form-group">
<label>خشم</label>
<select class="calc-input" data-key="khashm">
<option value="30">کنترل کردم (+30)</option>
<option value="-25">عصبی شدم (-25)</option>
</select>
</div>

<div class="form-group">
<label>زنگ زدن به پدر و مادر</label>
<select class="calc-input" data-key="parents">
<option value="0">نزدم (0)</option>
<option value="10">زنگ زدم (+10)</option>
</select>
</div>

<div class="form-group">
<label>غیبت</label>
<select class="calc-input" data-key="gheybat">
<option value="0">غیبت نکردم (0)</option>
<option value="-10">کم غیبت کردم (-10)</option>
<option value="-30">زیاد غیبت کردم (-30)</option>
</select>
</div>

<div class="form-group">
<label>دروغ</label>
<select class="calc-input" data-key="dorough">
<option value="0">دروغی نگفتم (0)</option>
<option value="-30">1 (-30)</option>
<option value="-60">2 (-60)</option>
<option value="-90">3 (-90)</option>
</select>
</div>

<div class="form-group">
<label>فحش</label>
<select class="calc-input" data-key="fohsh">
<option value="0">فحشی ندادم (0)</option>
<option value="-15">5 (-15)</option>
<option value="-30">10 (-30)</option>
<option value="-45">15 (-45)</option>
</select>
</div>
</div>

<!-- ۵. بونوس -->
<div class="section-title">۵. بونوس و توبه</div>
<div class="grid-form">
<div class="form-group">
<label>توبه</label>
<select class="calc-input" data-key="towbeh">
<option value="0">نکردم (0)</option>
<option value="40">کردم (+40)</option>
</select>
</div>
</div>

</div>

<!-- Summary Table View -->
<div id="summaryContainer">
<table class="summary-table" id="summaryTable">
<thead>
<tr>
<th>شاخص / روز</th>
<th>شنبه</th>
<th>یکشنبه</th>
<th>دوشنبه</th>
<th>سه‌شنبه</th>
<th>چهارشنبه</th>
<th>پنج‌شنبه</th>
<th>جمعه</th>
</tr>
</thead>
<tbody id="summaryTableBody">
</tbody>
</table>
</div>

<!-- Action Buttons -->
<div class="actions">
<button class="btn btn-reset" onclick="resetData()">شروع هفته جدید (پاکسازی)</button>
<button class="btn btn-print" onclick="window.print()">ذخیره / پرینت PDF</button>
</div>
</div>

<script>
var days = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه'];
var currentDay = 'شنبه';

var appData = {};
try {
appData = JSON.parse(localStorage.getItem('planner_app_data')) || {};
} catch(e) {
appData = {};
}

days.forEach(function(d) {
if (!appData[d]) appData[d] = {};
});

function saveState() {
localStorage.setItem('planner_app_data', JSON.stringify(appData));
}

function switchDay(day) {
currentDay = day;

var buttons = document.querySelectorAll('.tab-btn');
buttons.forEach(function(btn) {
if (btn.innerText.indexOf(day) !== -1) {
btn.classList.add('active');
} else {
btn.classList.remove('active');
}
});

if (day === 'خلاصه') {
document.getElementById('formContainer').style.display = 'none';
document.getElementById('summaryTable').style.display = 'table';
document.getElementById('currentDayTitle').innerText = 'کارنامه کلی';
renderSummaryTable();
} else {
document.getElementById('formContainer').style.display = 'block';
document.getElementById('summaryTable').style.display = 'none';
document.getElementById('currentDayTitle').innerText = day;
loadDayValues(day);
}
calculateScores();
}

function loadDayValues(day) {
var inputs = document.querySelectorAll('.calc-input');
inputs.forEach(function(input) {
var key = input.getAttribute('data-key');
if (appData[day] && appData[day][key] !== undefined) {
input.value = appData[day][key];
} else {
input.selectedIndex = 0;
}
});
}

var allInputs = document.querySelectorAll('.calc-input');
allInputs.forEach(function(input) {
input.addEventListener('change', function(e) {
if (currentDay !== 'خلاصه') {
var key = e.target.getAttribute('data-key');
if (!appData[currentDay]) appData[currentDay] = {};
appData[currentDay][key] = e.target.value;
saveState();
calculateScores();
}
});
});

function calculateScores() {
var totalWeek = 0;
var dayScores = {};

days.forEach(function(d) {
var dScore = 0;
if (appData[d]) {
Object.keys(appData[d]).forEach(function(key) {
dScore += parseInt(appData[d][key] || 0);
});
}
dayScores[d] = dScore;
totalWeek += dScore;
});

if (currentDay !== 'خلاصه') {
document.getElementById('dayScore').innerText = dayScores[currentDay] || 0;
} else {
document.getElementById('dayScore').innerText = '-';
}

var weekScoreElem = document.getElementById('weekScore');
weekScoreElem.innerText = totalWeek;
weekScoreElem.style.color = totalWeek >= 0 ? 'var(--success)' : 'var(--danger)';
}

function renderSummaryTable() {
var tbody = document.getElementById('summaryTableBody');
tbody.innerHTML = '';

var groups = document.querySelectorAll('#formContainer .form-group');
groups.forEach(function(group) {
var label = group.querySelector('label').innerText;
var select = group.querySelector('select');
var key = select.getAttribute('data-key');

var tr = document.createElement('tr');
var html = '<td style="text-align:right; font-weight:bold;">' + label + '</td>';

days.forEach(function(d) {
var val = parseInt((appData[d] && appData[d][key]) || 0);
var color = val > 0 ? 'green' : (val < 0 ? 'red' : 'gray');
html += '<td style="color:' + color + '; font-weight:bold;">' + val + '</td>';
});

tr.innerHTML = html;
tbody.appendChild(tr);
});

var totalTr = document.createElement('tr');
totalTr.style.background = '#f1f5f9';
totalTr.style.fontWeight = 'bold';
var totalHtml = '<td>مجموع امتیاز روز</td>';

days.forEach(function(d) {
var score = 0;
if (appData[d]) {
Object.keys(appData[d]).forEach(function(v) {
score += parseInt(appData[d][v] || 0);
});
}
totalHtml += '<td>' + score + '</td>';
});

totalTr.innerHTML = totalHtml;
tbody.appendChild(totalTr);
}

function resetData() {
if (confirm('آیا مطمئن هستید که می‌خواهید تمام اطلاعات هفته پاک شود؟')) {
localStorage.removeItem('planner_app_data');
appData = {};
days.forEach(function(d) { appData[d] = {}; });
switchDay('شنبه');
}
}

// Initial Run
switchDay('شنبه');
</script>

</body>
</html>
